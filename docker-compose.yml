services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexfin
      POSTGRES_PASSWORD: nexfin
      POSTGRES_DB: nexfin
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexfin"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./python-backend
    environment:
      DATABASE_URL: postgresql+psycopg2://nexfin:nexfin@db:5432/nexfin
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - ./python-backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./react-frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./react-frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  db_data:
